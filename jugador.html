<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jugador · Pokémon Añil Randomlocke</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container" id="root">
    <p class="muted">Cargando…</p>
  </main>

  <script src="app.js"></script>
  <script>
    (async function () {
      const cfg = await loadConfig();
      renderHeader("index.html");
      const id = param("id");
      const meta = cfg.players.find((p) => p.id === id);
      const root = document.getElementById("root");

      if (!meta) {
        root.innerHTML = `<div class="breadcrumb"><a href="index.html">← Inicio</a></div>
          <div class="empty-state">Jugador no encontrado. <a href="index.html">Volver</a></div>`;
        renderFooter();
        return;
      }

      const data = (await loadPlayer(id)) || emptyPlayerData(meta);
      document.title = meta.name + " · Randomlocke";
      const s = playerStats(data);
      const pct = Math.round((s.livesLeft / s.lives) * 100);
      const barCls = pct <= 20 ? "crit" : pct <= 50 ? "low" : "";
      const avSrc = data.avatar || meta.avatar;
      const avatar = avSrc
        ? `<img class="player-avatar xl" src="${escapeHtml(avSrc)}" alt="">`
        : `<div class="player-avatar xl">${initials(meta.name)}</div>`;

      // progreso
      const gymTotal = (cfg.gyms || []).length;
      const gymDone = (cfg.gyms || []).filter((g) => data.progress?.gyms?.[g.id]).length;

      root.innerHTML = `
        <div class="breadcrumb"><a href="index.html">← Inicio</a></div>
        <div class="panel" style="border-top:4px solid var(--accent)">
          <div class="row between" style="align-items:flex-start">
            <div class="row" style="align-items:center;gap:1rem">
              ${avatar}
              <div>
                <h1 style="margin:0">${escapeHtml(meta.name)} ${data.champion ? championBadge(26) : ""}</h1>
                <div class="muted">${s.eliminated ? "Eliminado (sin vidas)" : "En juego"} · ${gymDone}/${gymTotal} medallas ${data._local ? '· <span class="pill warn">borrador local sin publicar</span>' : ""}</div>
              </div>
            </div>
          </div>
          ${data.notes ? `<div class="callout" style="margin-top:1rem">${escapeHtml(data.notes)}</div>` : ""}
          <div class="stat-row" style="margin-bottom:.25rem">
            <div class="stat-tile"><div class="num ok">${s.alive}</div><div class="lbl">Vivos</div></div>
            <div class="stat-tile"><div class="num bad">${s.dead}</div><div class="lbl">Muertos</div></div>
            <div class="stat-tile"><div class="num">${s.livesLeft}<span style="font-size:.9rem;color:var(--text-muted)">/${s.lives}</span></div><div class="lbl">Vidas restantes</div></div>
            <div class="stat-tile"><div class="num">${(data.team||[]).length}</div><div class="lbl">En el equipo</div></div>
          </div>
          <div class="lives-bar"><span class="${barCls}" style="width:${pct}%"></span></div>
          <div style="margin-top:.75rem">${teamSpritesRow(data.team)}</div>
        </div>

        <div class="tabs" id="tabs">
          <button data-tab="equipo" class="active">Equipo (${(data.team||[]).length})</button>
          <button data-tab="caja">Caja (${(data.box||[]).length})</button>
          <button data-tab="cementerio">Cementerio (${(data.graveyard||[]).length})</button>
          <button data-tab="objetos">Objetos (${(cfg.groundItems||[]).filter((it)=>data.progress?.items?.[it.id]).length}/${(cfg.groundItems||[]).length})</button>
          <button data-tab="progreso">Progreso</button>
        </div>

        <div class="tab-panel active" id="tab-equipo"></div>
        <div class="tab-panel" id="tab-caja"></div>
        <div class="tab-panel" id="tab-cementerio"></div>
        <div class="tab-panel" id="tab-objetos"></div>
        <div class="tab-panel" id="tab-progreso"></div>
      `;

      const teamHtml = (data.team||[]).length
        ? `<div class="mon-team">${data.team.map((m)=>monCard(m)).join("")}</div>`
        : `<p class="empty-state">Sin Pokémon en el equipo.</p>`;
      document.getElementById("tab-equipo").innerHTML = teamHtml;

      document.getElementById("tab-caja").innerHTML = (data.box||[]).length
        ? `<div class="mon-team">${data.box.map((m)=>monCard(m)).join("")}</div>`
        : `<p class="empty-state">La caja está vacía.</p>`;

      document.getElementById("tab-cementerio").innerHTML = (data.graveyard||[]).length
        ? `<div class="mon-team">${data.graveyard.map((m)=>monCard(m,{dead:true})).join("")}</div>`
        : `<p class="empty-state">Cementerio vacío.</p>`;

      const gItems = cfg.groundItems || [];
      if (!gItems.length) {
        document.getElementById("tab-objetos").innerHTML = `<p class="empty-state">No hay ubicaciones de objetos configuradas. Agrégalas en <code>data/config.json</code>.</p>`;
      } else {
        const gotN = gItems.filter((it)=>data.progress?.items?.[it.id]).length;
        const zones=[], byZone={};
        gItems.forEach((it)=>{ const z=it.zone||"Otros"; if(!byZone[z]){byZone[z]=[];zones.push(z);} byZone[z].push(it); });
        document.getElementById("tab-objetos").innerHTML =
          `<p class="lead">Objetos obtenidos: <strong>${gotN}/${gItems.length}</strong>. Verde = ya obtenido · gris = pendiente. Consulta todas las ubicaciones en <a href="objetos.html">Objetos</a>.</p>` +
          zones.map((z)=>`<h3>${escapeHtml(z)}</h3><div class="check-grid">${byZone[z].map((it)=>{
            const done=!!data.progress?.items?.[it.id];
            return `<div class="check-item${done?" done":""}"><span class="dot"></span>${escapeHtml(it.note||it.id)}${done?'<span class="tag">✓ obtenido</span>':""}</div>`;
          }).join("")}</div>`).join("");
      }

      // ----- Progreso -----
      function checklist(items, doneMap) {
        if (!items.length) return `<p class="muted" style="font-size:.85rem">— nada configurado —</p>`;
        return `<div class="check-grid">${items.map((it)=>{
          const done = !!doneMap?.[it.id];
          return `<div class="check-item${done?" done":""}"><span class="dot"></span>${escapeHtml(it.name)}${done?'<span class="tag">✓ hecho</span>':""}</div>`;
        }).join("")}</div>`;
      }
      // capturas por ruta
      const capByRoute = {};
      (data.captures||[]).forEach((c)=>{ capByRoute[c.route] = c; });
      const routesHtml = (cfg.routes||[]).map((r)=>{
        const c = capByRoute[r.id];
        const visited = data.progress?.routes?.[r.id];
        let statusPill = '<span class="pill">sin visitar</span>';
        if (c) {
          if (c.status === "captured") statusPill = `<span class="pill ok">✓ ${escapeHtml(c.mon||"capturado")}</span>`;
          else if (c.status === "dead") statusPill = `<span class="pill bad">${faintIcon(12)} ${escapeHtml(c.mon||"debilitado")}</span>`;
          else if (c.status === "fled") statusPill = `<span class="pill warn">huyó / sin captura</span>`;
        } else if (visited) {
          statusPill = '<span class="pill">sin captura</span>';
        }
        return `<tr><td>${escapeHtml(r.name)}</td><td>${statusPill}</td></tr>`;
      }).join("");

      document.getElementById("tab-progreso").innerHTML = `
        <h3>Gimnasios</h3>
        ${trainerChecklist(cfg.gyms||[], data.progress?.gyms)}
        <h3>Bosses / combates clave</h3>
        ${trainerChecklist(cfg.bosses||[], data.progress?.bosses)}
        <h3>NPCs</h3>
        ${trainerChecklist(cfg.npcs||[], data.progress?.npcs)}
        <h3>Rutas y capturas</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Ruta / zona</th><th>Captura (primer Pokémon)</th></tr></thead>
          <tbody>${routesHtml || '<tr><td colspan="2" class="muted">Sin rutas configuradas.</td></tr>'}</tbody>
        </table></div>`;

      // tabs
      document.getElementById("tabs").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        document.querySelectorAll("#tabs button").forEach((x)=>x.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((x)=>x.classList.remove("active"));
        b.classList.add("active");
        document.getElementById("tab-"+b.dataset.tab).classList.add("active");
      });

      renderFooter();
    })();
  </script>
</body>
</html>
