<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
<title>Pokédex · Pokémon Añil Randomlocke</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="styles.css?v=1" />
  <style>
    .pk-hero { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; }
    .pk-art { width:200px; height:200px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--subtle-bg); border-radius:50%; }
    .pk-art img { width:180px; height:180px; object-fit:contain; image-rendering:pixelated; }
    .pk-num { color:var(--text-muted); font-weight:800; font-size:1rem; }
    .pk-name { font-size:2.2rem; font-weight:800; margin:.1rem 0 .4rem; }
    .pk-stats { display:grid; grid-template-columns:auto 3rem 1fr; gap:.3rem .6rem; align-items:center; max-width:480px; }
    .pk-stats .lbl { color:var(--text-muted); font-size:.85rem; }
    .pk-stats .val { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
    .pk-bar { height:12px; border-radius:999px; background:var(--subtle-bg); overflow:hidden; }
    .pk-bar > span { display:block; height:100%; }
    .pk-facts { display:flex; gap:1.5rem; flex-wrap:wrap; margin:.6rem 0; }
    .pk-facts .f { }
    .pk-facts .f .k { color:var(--text-muted); font-size:.65rem; text-transform:uppercase; letter-spacing:.04em; }
    .pk-facts .f .v { font-weight:700; }
    .evo-line { display:flex; gap:.5rem; align-items:flex-start; flex-wrap:wrap; }
    .evo-mon .tm-sp { font-size:.68rem; color:var(--text-muted); margin-top:.15rem; line-height:1.2; }
    .evo-mon { text-align:center; padding:.5rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel); color:var(--text); min-width:96px; }
    .evo-mon.cur { border-color:var(--accent); }
    .evo-mon img { width:72px; height:72px; object-fit:contain; }
    .evo-mon .nm { font-size:.8rem; font-weight:700; }
    .evo-arrow { color:var(--text-muted); font-size:1.4rem; }
    .pk-nav { display:flex; justify-content:space-between; margin-top:1.5rem; gap:.5rem; }
    .form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:.8rem; }
    .form-card { display:flex; gap:.7rem; align-items:center; border:1px solid var(--border); border-radius:10px; padding:.6rem; background:var(--subtle-bg); color:inherit; text-decoration:none; }
    .form-card:hover { border-color:var(--accent); text-decoration:none; box-shadow:0 2px 8px var(--shadow); }
    .form-card.cur { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .form-art { width:88px; height:88px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .form-art img { width:82px; height:82px; object-fit:contain; image-rendering:pixelated; }
    .form-body { min-width:0; flex:1; }
    .form-name { font-weight:800; font-size:.98rem; display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
    .form-kind { font-size:.6rem; text-transform:uppercase; font-weight:800; letter-spacing:.03em; color:#fff; border-radius:999px; padding:.08rem .5rem; }
    .form-kind.mega { background:linear-gradient(90deg,#6f35fc,#f95587); }
    .form-kind.reg { background:var(--accent); }
    .form-kind.alt { background:var(--type-psychic); }
    .form-ab { font-size:.76rem; margin:.15rem 0; }
    .form-stats { display:flex; flex-wrap:wrap; gap:.15rem .6rem; font-size:.72rem; color:var(--text-muted); }
    .form-stats b { color:var(--text); font-variant-numeric:tabular-nums; }
    .form-stats .tot b { color:var(--accent); }
  </style>
</head>
<body>
  <main class="container" id="root"><p class="muted">Cargando…</p></main>
  <script src="app.js?v=1"></script>
  <script>
    const STAT_LBL = ["PS", "Ataque", "Defensa", "At. Esp.", "Def. Esp.", "Velocidad"];
    (async function () {
      await loadConfig();
      renderHeader("pokedex.html");
      const dex = await loadPokedexFull();
      await loadTypesChart();
      const FORMSDEX = (await loadJSON("data/forms-dex.json")) || {};
      const root = document.getElementById("root");
      let id = parseInt(param("id"), 10);
      if (!id && param("sp")) id = speciesDexId(param("sp"));
      const base = dex[id];
      if (!base) { root.innerHTML = `<div class="breadcrumb"><a href="pokedex.html">← Pokédex</a></div><div class="empty-state">Pokémon no encontrado.</div>`; renderFooter(); return; }
      // Forma seleccionada (?form=índice) — muestra los datos de esa forma
      const formIdx = param("form");
      const allForms = FORMSDEX[id] || [];
      const fm = (formIdx != null && allForms[+formIdx]) ? allForms[+formIdx] : null;
      // "view" = datos a mostrar (la forma sobreescribe a la base; hereda categoría/altura/peso/desc/evolución)
      const p = fm
        ? { n: fm.n, t: fm.t, st: fm.st, ab: fm.ab, abh: fm.abh, cat: base.cat, h: base.h, w: base.w, fl: base.fl, em: base.em, pe: base.pe }
        : base;
      const formSpriteId = fm ? (fm.spr || id) : id;
      document.title = p.n + " · Pokédex Añil";
      const t0 = typeKey(p.t[0]);
      const total = (p.st || []).reduce((a, b) => a + (b || 0), 0);
      const staticSprite = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${formSpriteId}.png`;
      const aniSprite = fm ? staticSprite : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${id}.gif`;
      const baseStaticSprite = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
      const barColor = (v) => v >= 100 ? "var(--ok)" : v >= 60 ? "var(--accent)" : v >= 35 ? "var(--warn)" : "var(--bad)";
      const statsHtml = STAT_LBL.map((l, i) => {
        const v = p.st[i] || 0;
        return `<span class="lbl">${l}</span><span class="val">${v}</span><span class="pk-bar"><span style="width:${Math.min(100, v / 2)}%;background:${barColor(v)}"></span></span>`;
      }).join("");
      const spr = (eid) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${eid}.png`;
      const evoMon = (eid, name, how, cur) => {
        const inner = `${eid ? `<img src="${spr(eid)}" alt="" loading="lazy">` : `<div style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-weight:800">?</div>`}<div class="nm">${escapeHtml(name)}</div>${how ? `<div class="tm-sp" style="max-width:120px;white-space:normal">${escapeHtml(how)}</div>` : ""}`;
        return eid ? `<a class="evo-mon${cur ? " cur" : ""}" href="pokemon.html?id=${eid}">${inner}</a>` : `<span class="evo-mon">${inner}</span>`;
      };
      // Evoluciones directas de un id, agrupando varios métodos hacia un mismo destino
      const evosOf = (pid) => {
        const q = dex[pid]; if (!q || !q.em) return [];
        const map = new Map();
        for (const e of q.em) {
          const key = e.toId || ("n:" + e.to);
          if (!map.has(key)) map.set(key, { toId: e.toId, to: e.to, hows: [] });
          const g = map.get(key); if (!g.hows.includes(e.how)) g.hows.push(e.how);
        }
        return [...map.values()].map((x) => ({ toId: x.toId, to: x.to, how: x.hows.join(" / ") }));
      };
      let evoHtml;
      if (p.pe || (p.em && p.em.length)) {
        // subir hasta la base
        let root = id, guard = 0;
        while (dex[root] && dex[root].pe && guard++ < 12) root = dex[root].pe.id;
        // bajar por etapas (cada etapa es una columna; ramas incluidas)
        const stages = []; let frontier = [{ id: root, name: dex[root] ? dex[root].n : p.n, how: "" }];
        const seen = new Set(); let depth = 0;
        while (frontier.length && depth++ < 8) {
          stages.push(frontier);
          const next = [];
          for (const node of frontier) {
            if (node.id == null || seen.has(node.id)) continue;
            seen.add(node.id);
            for (const e of evosOf(node.id)) next.push({ id: e.toId, name: e.to, how: e.how });
          }
          frontier = next;
        }
        const col = (stage) => `<span style="display:flex;flex-direction:column;gap:.4rem">${stage.map((n) => evoMon(n.id, n.name, n.how, n.id === id)).join("")}</span>`;
        evoHtml = `<h2>Evolución</h2><div class="evo-line">${stages.map(col).join(`<span class="evo-arrow">→</span>`)}</div>`;
      } else {
        evoHtml = `<h2>Evolución</h2><p class="muted">No evoluciona.</p>`;
      }
      const prev = dex[id - 1] ? `<a class="btn" href="pokemon.html?id=${id - 1}">← #${id - 1} ${escapeHtml(dex[id - 1].n)}</a>` : "<span></span>";
      const next = dex[id + 1] ? `<a class="btn" href="pokemon.html?id=${id + 1}">#${id + 1} ${escapeHtml(dex[id + 1].n)} →</a>` : "<span></span>";

      const mu = typeMatchups(p.t);
      const muChip = (o) => `<span class="type-badge sm" style="background:var(--type-${o.key})">${escapeHtml(TYPES_CSS_ES[o.key])}<b class="tm-x">${multLabel(o.m)}</b></span>`;
      const muRow = (lbl, list) => `<div class="tm-row"><span class="tm-lbl">${lbl}</span><div class="tm-chips">${list.length ? list.map(muChip).join("") : '<span class="muted">Ninguna</span>'}</div></div>`;
      const muHtml = `<h2>Debilidades y resistencias</h2>
        <div class="panel"><div class="tmatch">
          ${muRow("Débil a", mu.weak)}
          ${muRow("Resiste", mu.resist)}
          ${mu.immune.length ? muRow("Inmune a", mu.immune) : ""}
        </div></div>`;

      const forms = FORMSDEX[id] || [];
      const formCard = (fm, idx) => {
        const k0 = typeKey((fm.t || [])[0] || "");
        const total = (fm.st || []).reduce((a, b) => a + (b || 0), 0);
        const kindBadge = fm.k === "mega"
          ? `<span class="form-kind mega">Mega</span>`
          : fm.k === "regional"
            ? `<span class="form-kind reg">${escapeHtml(fm.region || "Regional")}</span>`
            : `<span class="form-kind alt">Forma</span>`;
        const abh = (Array.isArray(fm.abh) ? fm.abh : fm.abh ? [fm.abh] : []);
        const fmTotal = (fm.st || []).reduce((a, b) => a + (b || 0), 0);
        const cur = formIdx != null && +formIdx === idx;
        return `<a class="form-card${cur ? " cur" : ""}" href="pokemon.html?id=${id}&form=${idx}">
          <div class="form-art" style="background:color-mix(in srgb, var(--type-${k0}) 16%, var(--subtle-bg))">
            <img src="${spr(fm.spr || id)}" alt="${escapeHtml(fm.n)}" loading="lazy" onerror="this.onerror=null;this.src='${spr(id)}'">
          </div>
          <div class="form-body">
            <div class="form-name">${escapeHtml(fm.n)} ${kindBadge}</div>
            <div class="mon-types" style="margin:.3rem 0">${(fm.t || []).map((t) => typeBadge(t, true)).join(" ")}</div>
            <div class="form-ab muted">${(fm.ab || []).map(escapeHtml).join(", ")}${abh.map((h) => ` · ${escapeHtml(h)} (oculta)`).join("")}</div>
            <div class="form-stats">${STAT_LBL.map((l, i) => `<span>${l} <b>${fm.st[i] || 0}</b></span>`).join("")}<span class="tot">Total <b>${fmTotal}</b></span></div>
          </div>
        </a>`;
      };
      const formsHtml = forms.length
        ? `<h2>Formas <span class="muted" style="font-size:.9rem;font-weight:600">(${forms.length})</span></h2><div class="panel"><div class="form-grid">${forms.map((f, i) => formCard(f, i)).join("")}${fm ? `<a class="form-card" href="pokemon.html?id=${id}"><div class="form-art"><img src="${baseStaticSprite}" alt="" loading="lazy"></div><div class="form-body"><div class="form-name">${escapeHtml(base.n)} <span class="form-kind" style="background:var(--text-muted)">Base</span></div><div class="mon-types" style="margin:.3rem 0">${(base.t || []).map((t) => typeBadge(t, true)).join(" ")}</div></div></a>` : ""}</div></div>`
        : "";

      root.innerHTML = `
        <div class="breadcrumb"><a href="pokedex.html">← Pokédex</a>${fm ? ` · <a href="pokemon.html?id=${id}">${escapeHtml(base.n)}</a> · <span class="muted">${escapeHtml(p.n)}</span>` : ""}</div>
        <div class="panel" style="border-top:5px solid var(--type-${t0})">
          <div class="pk-hero">
            <div class="pk-art" style="background:color-mix(in srgb, var(--type-${t0}) 18%, var(--subtle-bg))">
              <img src="${aniSprite}" alt="${escapeHtml(p.n)}" onerror="this.onerror=null;this.src='${fm ? baseStaticSprite : staticSprite}'">
            </div>
            <div class="grow" style="min-width:280px">
              <div class="pk-num">Nº ${String(id).padStart(4, "0")}${fm ? ` · <span class="form-kind ${fm.k === "mega" ? "mega" : fm.k === "regional" ? "reg" : "alt"}" style="vertical-align:middle">${fm.k === "mega" ? "Mega" : fm.k === "regional" ? escapeHtml(fm.region || "Regional") : "Forma"}</span>` : ""}</div>
              <div class="pk-name">${escapeHtml(p.n)}</div>
              <div class="muted">${escapeHtml(p.cat || "")}</div>
              <div class="mon-types" style="margin:.5rem 0">${(p.t || []).map((t) => typeBadge(t)).join(" ")}</div>
              <div class="pk-facts">
                <div class="f"><div class="k">Altura</div><div class="v">${p.h != null ? p.h + " m" : "—"}</div></div>
                <div class="f"><div class="k">Peso</div><div class="v">${p.w != null ? p.w + " kg" : "—"}</div></div>
                <div class="f"><div class="k">Habilidades</div><div class="v">${(p.ab || []).map(escapeHtml).join(", ")}${(Array.isArray(p.abh) ? p.abh : p.abh ? [p.abh] : []).map((h) => ` · <span class="muted">${escapeHtml(h)} (oculta)</span>`).join("")}</div></div>
              </div>
            </div>
          </div>
          ${p.fl ? `<p style="margin:.5rem 0 0">${escapeHtml(p.fl)}</p>` : ""}
        </div>

        <h2>Estadísticas base</h2>
        <div class="panel">
          <div class="pk-stats">${statsHtml}
            <span class="lbl" style="font-weight:800;color:var(--text)">Total</span><span class="val">${total}</span><span></span>
          </div>
        </div>
        ${muHtml}
        ${formsHtml}
        ${evoHtml ? `<div class="panel" style="margin-top:1rem">${evoHtml}</div>` : ""}
        <div class="pk-nav">${prev}${next}</div>
      `;
      renderFooter();
    })();
  </script>
</body>
</html>
